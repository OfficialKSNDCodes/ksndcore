<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="KSND — The System">
  <title>KSND — The System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="landing">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="grain"></div>

  <header class="topbar">
    <div class="wordmark">KSND <span>// CORE</span></div>
    <div class="status"><i></i> SYSTEM ACTIVE</div>
  </header>

  <section class="hero" aria-label="KSND system entry">
    <div class="pod-wrap" id="podWrap">
      <div class="pod-shadow"></div>
      <div class="pod" id="pod">
        <img src="assets/ksnd-lab-pod.jpg" alt="KSND Lab reconstruction pod">
        <div class="pod-sheen"></div>
        <div class="core-orbit core-orbit-one"></div>
        <div class="core-orbit core-orbit-two"></div>
      </div>
    </div>

    <div class="hero-meta meta-left">
      <span>PROJECT</span><strong>KSND LAB</strong>
      <span>BUILD MODE</span><strong>DISCOVERY</strong>
    </div>

    <div class="hero-meta meta-right">
      <span>SESSION</span><strong>001 / ∞</strong>
      <span>STATUS</span><strong>FOUNDATION</strong>
    </div>

    <div class="entry">
      <button class="enter" id="enter" type="button">
        <span>ENTER THE SYSTEM</span><b>→</b>
      </button>
      <div class="entry-state" id="entryState">AWAITING INPUT</div>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
